name: Publish npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Wade11s/LayerFS-MCP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install OIDC-capable npm
        run: npm install --global npm@11
      - name: Check whether this version needs publishing
        id: release
        run: node scripts/release-check.mjs
      - if: steps.release.outputs.publish == 'true'
        run: npm ci
      - if: steps.release.outputs.publish == 'true'
        run: npm run check
      - if: steps.release.outputs.publish == 'true'
        run: npm test
      - if: steps.release.outputs.publish == 'true'
        run: npm pack --dry-run
      - name: Publish using npm Trusted Publishing
        if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --provenance
